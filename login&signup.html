<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Palm and Pine | Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1620820186187-fc32e79adb74?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Y29mZmVlJTIwYmFja2dyb3VuZHxlbnwwfHwwfHx8MA%3D%3D');
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #b7a89c;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #281e16;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #281e16;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .toggle {
      text-align: center;
      margin-top: 15px;
    }
    .toggle a {
      color: #281e16;
      cursor: pointer;
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="signupForm">
      <h2>Sign Up</h2>
      <input type="text" id="signupUsername" placeholder="Username" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <button type="submit">Sign Up</button>
      <div class="toggle">Already have an account? <a href="#" onclick="event.preventDefault(); toggleForm('login')">Log In</a></div>
    </form>

    <form id="loginForm" class="hidden">
      <h2>Log In</h2>
      <input type="text" id="loginUsername" placeholder="Username or Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Log In</button>
      <div class="toggle">Don't have an account? <a href="#" onclick="event.preventDefault(); toggleForm('signup')">Sign Up</a></div>
    </form>
  </div>

  <script>
    function toggleForm(form) {
      document.getElementById('signupForm').classList.toggle('hidden', form !== 'signup');
      document.getElementById('loginForm').classList.toggle('hidden', form !== 'login');
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Signed up successfully!');
      window.location.href = "project.html";
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Logged in successfully!');
      window.location.href = "project.html";
    });
  </script>
</body>
</html>
